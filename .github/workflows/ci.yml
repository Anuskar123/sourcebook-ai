name: Verify foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            services/ml/requirements.txt
            services/worker/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pip check
      - run: python -m pytest tests -q

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run setup
      - run: docker compose --profile app config --quiet
